{% load static %}

<!DOCTYPE html>
<html>
<head>
    <title>AutoVision AI - Signup</title>

    <link rel="stylesheet" href="{% static 'predictor/css/signup.css' %}">
</head>

<body>

    <h1>AutoVision AI</h1>
    <h2>Signup</h2>
    
    <form method="POST">
        {% csrf_token %}

        {% if error %}
    <p style="color: red;">{{ error }}</p>
            {% endif %}
        <input
            type="email"
            name="email"
            placeholder="example@gmail.com"
            required
        >

        <br><br>

        <input
            type="password"
            name="password"
            placeholder="Password"
            required
        >

        <br><br>

        <input
            type="password"
            name="confirm_password"
            placeholder="Confirm Password"
            required
        >

        <br><br>

        <button type="submit">Signup</button>

        <p>If already registered</p>

        <a href="{% url 'login' %}" class="login">Login</a>
    </form>

</body>
</html>
