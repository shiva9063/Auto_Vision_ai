{% load static %}

<!DOCTYPE html>

<html>
<head>
    <title>AutoVision AI - Login</title>
    <link rel="stylesheet" href="{% static 'predictor/css/login.css' %}">
</head>

<body>

    <h1>AutoVision AI</h1>
    <h2>Login</h2>

    <form method="POST">
        {% csrf_token %}

        <input
            type="email"
            name="email"
            placeholder="example@gmail.com"
            required
        >

        <br><br>

        <input
            type="password"
            name="password"
            placeholder="Password"
            required
        >

        <br><br>

        <button type="submit">Login</button>
    </form>

    {% if error %}
        <p class="error">{{ error }}</p>
    {% endif %}

</body>
</html>
